<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #2d5a27; }
      .leaf { fill: #a8d5a2; }
      .vein { stroke: #5a9a52; stroke-width: 2; fill: none; }
      .stem { stroke: #a8d5a2; stroke-width: 4; fill: none; stroke-linecap: round; }
      .root { stroke: #a8d5a2; stroke-width: 3; fill: none; stroke-linecap: round; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f2d0d; }
      .leaf { fill: #6db86a; }
      .vein { stroke: #4a8a42; stroke-width: 2; fill: none; }
      .stem { stroke: #6db86a; stroke-width: 4; fill: none; stroke-linecap: round; }
      .root { stroke: #6db86a; stroke-width: 3; fill: none; stroke-linecap: round; }
    }
  </style>
  
  <!-- Background -->
  <rect class="bg" width="180" height="180" rx="40" />
  
  <!-- Leaf - organic shape with natural curves -->
  <path class="leaf" d="
    M 90 35
    C 75 35, 55 50, 50 70
    C 45 90, 55 105, 70 108
    C 75 109, 80 107, 85 103
    L 90 98
    L 95 103
    C 100 107, 105 109, 110 108
    C 125 105, 135 90, 130 70
    C 125 50, 105 35, 90 35
    Z
  " />
  
  <!-- Leaf veins -->
  <path class="vein" d="M 90 45 L 90 95" />
  <path class="vein" d="M 90 55 C 80 65, 65 75, 58 85" />
  <path class="vein" d="M 90 55 C 100 65, 115 75, 122 85" />
  <path class="vein" d="M 90 70 C 82 78, 70 85, 65 92" />
  <path class="vein" d="M 90 70 C 98 78, 110 85, 115 92" />
  
  <!-- Stem -->
  <path class="stem" d="M 90 98 L 90 130" />
  
  <!-- Roots - organic curves -->
  <path class="root" d="M 90 130 C 85 140, 70 148, 60 155" />
  <path class="root" d="M 90 130 C 92 142, 95 152, 98 160" />
  <path class="root" d="M 90 130 C 95 140, 110 148, 120 155" />
</svg>
